version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: car_repair_db
    environment:
      POSTGRES_USER: car_repair_user
      POSTGRES_PASSWORD: car_repair_pass
      POSTGRES_DB: car_repair_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_repair_user -d car_repair_api"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: car_repair_api
    environment:
      DATABASE_URL: postgresql://car_repair_user:car_repair_pass@db:5432/car_repair_api
      SECRET_KEY: development-secret-key-change-in-production
      ADMIN_API_KEY: admin-development-key
      ENVIRONMENT: development
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
